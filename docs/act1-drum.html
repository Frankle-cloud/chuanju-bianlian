<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>入戏 · 锣鼓交互交付演示</title><style>body{margin:0;background:#151813;color:#eee8dc;font:15px system-ui,"Microsoft YaHei",sans-serif}header,footer{padding:16px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}header strong{color:#d7b57a}header span{color:#aaa89b;font-size:13px}#stage{position:relative;width:min(100%,1440px);aspect-ratio:16/9;margin:auto;background:#25271f}button{background:#343b2e;color:#eee8dc;border:1px solid #786a4e;border-radius:5px;padding:10px 17px;cursor:pointer}button:hover{background:#5a4932}#result{color:#d7b57a}footer small{flex-basis:100%;color:#aaa89b}/* 将摄像头video置于容器底层，组件透明叠加；两者使用同一个16:9容器。 */

</style><header><strong>锣鼓交互 · 接入演示</strong><span>拖动鼓槌调整位置；A / D 或下方按钮试敲。此演示不调用摄像头。</span></header><main id="stage"><video class="camera-pip" autoplay muted playsinline></video></main><footer><button id="left">左手敲击 · A</button><button id="right">右手敲击 · D</button><button id="reset">重置</button><label><input id="anchors" type="checkbox"> 显示握柄旋转点</label><span id="result">按 左 → 右 → 左 → 右 完成四拍</span><small>四拍后：鼠标在画面右下“下一幕”停留1秒，或点击按钮。这里只发出跳转事件，不包含水袖页面。</small></footer><script src="lib/drum-component.js"></script>

const DATA={"config":{"stage":{"width":1920,"height":1080},"drum":{"file":"drum.png","x":795,"y":450,"width":330,"height":495,"sourceWidth":1024,"sourceHeight":1536},"sticks":{"left":{"file":"stick_left.png","sourceWidth":553,"sourceHeight":1201,"x":812.1975,"y":419.69726792009396,"width":97.5,"height":211.61280846063454,"pivotNormalized":[0.25,0.81],"tipNormalized":[0.899,0.05],"anchor":{"x":836.5725,"y":591.103642773208},"angleDeg":0},"right":{"file":"stick_right.png","sourceWidth":553,"sourceHeight":1201,"x":1011.46,"y":419.9251586368978,"width":97.5,"height":211.61280846063454,"pivotNormalized":[0.75,0.81],"tipNormalized":[0.104,0.052],"anchor":{"x":1084.585,"y":591.3315334900118},"angleDeg":0}},"command":{"x":1560,"y":804,"width":280,"height":88,"dwellMs":1000},"sequence":["left","right","left","right"],"hitCooldownMs":280},"assets":{"drum.png":"assets/drum.png?v=2","stick_right.png":"assets/stick_right.png","stick_left.png":"assets/stick_left.png"},"ui":"<svg xmlns=\"http://www.w3.org/2000/svg\" xmlns:ns1=\"http://www.inkscape.org/namespaces/inkscape\" width=\"1920\" height=\"1080\" viewBox=\"0 0 1920 1080\"><title>川剧锣鼓 · 页面布局第一版</title><desc>1920×1080透明UI。鼓和左右鼓槌由独立PNG叠加。</desc><g id=\"header\" ns1:groupmode=\"layer\" ns1:label=\"01 顶部品牌与流程\"><rect x=\"80\" y=\"48\" width=\"44\" height=\"48\" rx=\"2\" fill=\"#873A2D\" stroke=\"#D7B57A\" stroke-opacity=\".6\" /><text id=\"seal\" x=\"102\" y=\"83\" fill=\"#F4EBDD\" font-family=\"Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif\" font-size=\"27\" text-anchor=\"middle\">戏</text><text id=\"brand\" x=\"145\" y=\"85\" fill=\"#F4EBDD\" font-family=\"Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif\" font-size=\"34\" text-anchor=\"start\">入戏</text><text id=\"brand-sub\" x=\"250\" y=\"82\" fill=\"#CDC2AE\" font-family=\"Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif\" font-size=\"18\" text-anchor=\"start\">川剧手势体验</text><g id=\"centered-navigation\" transform=\"translate(-401.633 0)\"><text id=\"nav-0\" x=\"1050\" y=\"82\" fill=\"#D7B57A\" font-family=\"Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif\" font-size=\"21\" text-anchor=\"start\">01   锣鼓</text><circle cx=\"1060\" cy=\"105\" r=\"3\" fill=\"#D7B57A\" /><text id=\"nav-1\" x=\"1300\" y=\"82\" fill=\"#CDC2AE\" font-family=\"Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif\" font-size=\"21\" text-anchor=\"start\">02   水袖</text><text id=\"nav-2\" x=\"1540\" y=\"82\" fill=\"#CDC2AE\" font-family=\"Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif\" font-size=\"21\" text-anchor=\"start\">03   变脸与吐火</text></g><path d=\"M80 128H1840\" stroke=\"#D7B57A\" stroke-opacity=\".35\" /></g><g id=\"chapter\" ns1:groupmode=\"layer\" ns1:label=\"02 章节标题\"><text id=\"chapter-number\" x=\"80\" y=\"199\" fill=\"#D7B57A\" font-family=\"Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif\" font-size=\"19\" text-anchor=\"start\">第一幕</text><text id=\"chapter-title\" x=\"80\" y=\"265\" fill=\"#F4EBDD\" font-family=\"Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif\" font-size=\"48\" text-anchor=\"start\">川剧锣鼓</text><text id=\"chapter-note\" x=\"80\" y=\"309\" fill=\"#CDC2AE\" font-family=\"Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif\" font-size=\"22\" text-anchor=\"start\">鼓点起，好戏开场</text></g><g id=\"instructions\" ns1:groupmode=\"layer\" ns1:label=\"03 动作提示与四拍进度\"><text id=\"action-title\" x=\"960\" y=\"209\" fill=\"#F4EBDD\" font-family=\"Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif\" font-size=\"31\" text-anchor=\"middle\">双手握拳，交替向下敲击</text><text id=\"action-description\" x=\"960\" y=\"252\" fill=\"#CDC2AE\" font-family=\"Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif\" font-size=\"20\" text-anchor=\"middle\">抬手准备 · 下击敲鼓</text><circle id=\"beat-0\" cx=\"780\" cy=\"308\" r=\"23\" fill=\"#25251F\" fill-opacity=\".8\" stroke=\"#D7B57A\" stroke-opacity=\".7\" /><text id=\"beat-0-label\" x=\"780\" y=\"316\" fill=\"#D7B57A\" font-family=\"Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif\" font-size=\"19\" text-anchor=\"middle\">左</text><path d=\"M815 308H865\" stroke=\"#D7B57A\" stroke-opacity=\".4\" /><circle id=\"beat-1\" cx=\"900\" cy=\"308\" r=\"23\" fill=\"#25251F\" fill-opacity=\".8\" stroke=\"#D7B57A\" stroke-opacity=\".7\" /><text id=\"beat-1-label\" x=\"900\" y=\"316\" fill=\"#D7B57A\" font-family=\"Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif\" font-size=\"19\" text-anchor=\"middle\">右</text><path d=\"M935 308H985\" stroke=\"#D7B57A\" stroke-opacity=\".4\" /><circle id=\"beat-2\" cx=\"1020\" cy=\"308\" r=\"23\" fill=\"#25251F\" fill-opacity=\".8\" stroke=\"#D7B57A\" stroke-opacity=\".7\" /><text id=\"beat-2-label\" x=\"1020\" y=\"316\" fill=\"#D7B57A\" font-family=\"Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif\" font-size=\"19\" text-anchor=\"middle\">左</text><path d=\"M1055 308H1105\" stroke=\"#D7B57A\" stroke-opacity=\".4\" /><circle id=\"beat-3\" cx=\"1140\" cy=\"308\" r=\"23\" fill=\"#25251F\" fill-opacity=\".8\" stroke=\"#D7B57A\" stroke-opacity=\".7\" /><text id=\"beat-3-label\" x=\"1140\" y=\"316\" fill=\"#D7B57A\" font-family=\"Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif\" font-size=\"19\" text-anchor=\"middle\">右</text></g><g id=\"command\" ns1:groupmode=\"layer\" ns1:label=\"05 固定指令区域\"><rect id=\"command-hit-area\" x=\"1560\" y=\"804\" width=\"280\" height=\"88\" rx=\"5\" fill=\"#873A2D\" stroke=\"#D7B57A\" stroke-opacity=\".8\" /><text id=\"command-label\" x=\"1700\" y=\"859\" fill=\"#F4EBDD\" font-family=\"Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif\" font-size=\"27\" text-anchor=\"middle\">下一幕  →</text><text id=\"command-note\" x=\"1700\" y=\"932\" fill=\"#CDC2AE\" font-family=\"Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif\" font-size=\"18\" text-anchor=\"middle\">完成四拍后进入此区域</text></g><g id=\"footer\" ns1:groupmode=\"layer\" ns1:label=\"06 备注与连接状态\"><path d=\"M80 986H1840\" stroke=\"#D7B57A\" stroke-opacity=\".3\" /><text id=\"footer-note\" x=\"80\" y=\"1032\" fill=\"#CDC2AE\" font-family=\"Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif\" font-size=\"20\" text-anchor=\"start\">每次敲击后抬手复位，完成四拍后选择“下一幕”。</text><circle cx=\"1630\" cy=\"1025\" r=\"4\" fill=\"#D7B57A\" /><text id=\"camera-status\" x=\"1650\" y=\"1032\" fill=\"#CDC2AE\" font-family=\"Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif\" font-size=\"18\" text-anchor=\"start\">等待接入手势</text></g></svg>"};
const drumHitAudios={left:new Audio('sounds/drum_hit.wav'),right:new Audio('sounds/drum_hit_right.wav')};function playDrumHit(side='left'){const a=drumHitAudios[side]||drumHitAudios.left;try{a.currentTime=0;}catch(e){}a.play().catch(()=>{});}
const result=document.querySelector('#result');
const scene=OperaDrum.create(document.querySelector('#stage'),{...DATA,onHit:e=>{result.textContent=e.correct?'已完成 '+e.progress+'/4 拍':'敲击已响应，请按 左→右→左→右 完成引导';},onComplete:()=>{result.textContent='四拍完成！下一幕已解锁';},onCommand:()=>{result.textContent='已发出 next 事件 → 水袖（同伴在此接入跳转）';parent.postMessage({type:'opera:next',from:'drum',to:'sleeves'},'*');}});
window.drumScene=scene;scene.setStatus('鼠标模拟 · 未接摄像头');
let camActive=false;
window.addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='opera:input'||d.act!=='drum')return;camActive=true;for(const h of d.hands)scene.setHand(h.side,h);for(const s of d.hits)scene.hit(s);scene.updateCommandPointer(d.command);});
for(const side of ['left','right'])document.getElementById(side).onclick=()=>{if(!camActive){if(scene.hit(side))playDrumHit(side);}};
document.getElementById('reset').onclick=()=>{scene.reset();result.textContent='按 左 → 右 → 左 → 右 完成四拍';};
document.getElementById('anchors').onchange=e=>scene.showAnchors(e.target.checked);
document.addEventListener('keydown',e=>{if(e.repeat||/INPUT|TEXTAREA/.test(e.target.tagName)||camActive)return;if(e.code==='KeyA'&&scene.hit('left'))playDrumHit('left');if(e.code==='KeyD'&&scene.hit('right'))playDrumHit('right');});
let drag=null,offset=null,pointer=null;
scene.svg.addEventListener('pointerdown',e=>{const group=e.target.closest('[data-side]');if(!group)return;drag=group.dataset.side;const p=scene.clientToStage(e.clientX,e.clientY);const matrix=group.transform.baseVal.consolidate().matrix;offset={x:matrix.e-p.x,y:matrix.f-p.y};scene.svg.setPointerCapture(e.pointerId);});
scene.svg.addEventListener('pointermove',e=>{pointer=scene.clientToStage(e.clientX,e.clientY);if(drag&&!camActive)scene.setHand(drag,{x:pointer.x+offset.x,y:pointer.y+offset.y});});
scene.svg.addEventListener('pointerup',()=>{drag=null;});scene.svg.addEventListener('pointercancel',()=>{drag=null;pointer=null;});scene.svg.addEventListener('pointerleave',()=>{pointer=null;});
function loop(){if(!camActive)scene.updateCommandPointer(pointer&&!drag?{...pointer,x:pointer.x,y:pointer.y,active:true}:{active:false});requestAnimationFrame(loop);}loop();
</script></html>
