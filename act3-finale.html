(function(root,factory){if(typeof module==='object')module.exports=factory();else root.FinaleCore=factory();})(typeof globalThis!=='undefined'?globalThis:this,()=>{
class Core{
 constructor(){this.reset();}
 reset(){this.index=0;this.changes=0;this.fires=0;this.fireUntil=0;this.coolUntil=0;this.ended=false;this.hands=new Map();this.last=0;this.progress=0;this.present=false;}
 clear(){this.hands.clear();this.progress=0;this.fireUntil=0;this.present=false;}
 change(t){if(!this.present||this.ended||t<this.fireUntil||t<this.coolUntil)return false;this.index=(this.index+1)%12;this.changes++;this.coolUntil=t+700;return true;}
 fire(t){if(!this.present||this.ended||t<this.fireUntil)return false;this.fires++;this.fireUntil=t+1300;return true;}
 tick(t,face,hands=[]){
 const events=[];this.last=t;if(this.ended)return events;
 if(!face){this.clear();return events;}this.present=true;this.progress=0;
 const seen=new Set();
 for(const h of hands){seen.add(h.id);let s=this.hands.get(h.id);if(!s){s={pinch:null,latched:false,swipe:null,swipeLatched:false,dwell:null};this.hands.set(h.id,s);}
 const inButton=h.x>=1560&&h.x<=1840&&h.y>=804&&h.y<=892;
 if(inButton){s.swipe=null;s.pinch=null;if(h.pinchRatio<.32)s.latched=true;
 if(this.changes&&this.fires){if(s.dwell===null)s.dwell=t;this.progress=Math.max(this.progress,Math.min(1,(t-s.dwell)/1000));if(this.progress>=1){this.ended=true;events.push('end');break;}}continue;}
 s.dwell=null;
 if(h.pinchRatio>.38){s.latched=false;s.pinch=null;}
 if(h.pinchRatio<.32){s.swipe=null;if(s.pinch===null)s.pinch=t;if(!s.latched&&t-s.pinch>=260){s.latched=true;if(this.fire(t))events.push('fire');}continue;}
 if(!s.latched)s.pinch=null;
 if(t<this.fireUntil||!h.openPalm){s.swipe=null;s.swipeLatched=false;continue;}
 const near=Math.abs(h.y-face.y)<face.width*.9&&Math.abs(h.x-face.x)<face.width*1.3;
 if(!near){s.swipe=null;s.swipeLatched=false;continue;}
 if(s.swipeLatched)continue;
 if(!s.swipe||t-s.swipe.t>1100)s.swipe={x:h.x,y:h.y,t};
 if(t-s.swipe.t>=80&&Math.abs(h.x-s.swipe.x)>face.width*.5&&Math.abs(h.y-s.swipe.y)<face.width*.55){if(this.change(t)){events.push('change');s.swipeLatched=true;}s.swipe=null;}
 }

 }

(function(){

 function map(p){const s=Math.min(W/sourceWidth,H/sourceHeight),w=sourceWidth*s,h=sourceHeight*s;return{x:(W-w)/2+(mirror?1-p.x:p.x)*w,y:(H-h)/2+p.y*h};}
 function setFrame(frame){lastInput=performance.now();raw=frame;if(!frame||!frame.face){face=null;return;}
 const a=map(frame.face.leftEye),b=map(frame.face.rightEye),m=map(frame.face.mouth),left=a.x<b.x?a:b,right=a.x<b.x?b:a;

 if(!Number.isFinite(width)||width<20){face=null;return;}
 face={x:(left.x+right.x)/2,y:(left.y+right.y)/2,width,angle:Math.atan2(right.y-left.y,right.x-left.x),mouth:m};
 }

 function renderFire(t){

 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=Math.min(1,age*13)*fade;

 // per-column displacements. Image keeps its native alpha, no rectangular glow.
 const cols=48,sw=flame.width/cols,step=dw/cols;

 }

 ctx.globalCompositeOperation='screen';

 root.querySelector('[data-count]').textContent=String(core.index+1).padStart(2,'0')+' / 12';
 root.querySelector('[data-change]').textContent=core.changes?'✓ 已体验变脸':'挥掌变脸';root.querySelector('[data-fire]').textContent=core.fires?'✓ 已体验喷火':'捏合喷火';
 const btn=root.querySelector('[data-end]');btn.disabled=!(core.changes&&core.fires)||core.ended;

 }

const message=document.querySelector('#message');let lost=false,point={x:.5,y:.63},stream=null,camActive=false,cameraFrame=null;
const demo=OperaFinale.create({root,assets:FINALE_ASSETS,mirror:true,frameProvider:()=>lost?null:(camActive?cameraFrame:{face:{leftEye:{x:point.x-.027,y:point.y},rightEye:{x:point.x+.027,y:point.y},mouth:{x:point.x,y:point.y+.08}},hands:[]}),onEnd(){root.querySelector('.finished').classList.add('show');parent.postMessage({type:'opera:next',from:'face-fire',to:'end'},'*');}});
demo.ready.then(()=>message.textContent='已加载12款脸谱与共用头饰，可以体验变脸和喷火。').catch(e=>message.textContent=e.message);
window.addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='opera:input'||d.act!=='finale')return;camActive=true;if(d.width&&d.height)demo.setSourceSize(d.width,d.height);cameraFrame=d.frame;document.querySelector('#camera').style.display='none';});
root.addEventListener('pointermove',e=>{const r=root.getBoundingClientRect();if(e.target.closest('button'))return;point={x:Math.min(.65,Math.max(.35,(e.clientX-r.left)/r.width)),y:Math.min(.68,Math.max(.60,(e.clientY-r.top)/r.height))};});
document.querySelector('#change').onclick=()=>demo.triggerChange();document.querySelector('#fire').onclick=()=>demo.triggerFire();
document.querySelector('#lost').onclick=e=>{lost=!lost;e.target.textContent=lost?'恢复模拟人脸':'模拟人脸丢失';};
document.querySelector('#reset').onclick=()=>{demo.reset();frozen=false;document.querySelector('#freeze').textContent='定格查看喷火效果';root.querySelector('.finished').classList.remove('show');};
document.querySelector('#camera').onclick=async e=>{try{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;root.querySelector('video').srcObject=null;e.target.textContent='开启摄像头背景';return;}stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});root.querySelector('video').srcObject=stream;e.target.textContent='关闭摄像头背景';message.textContent='摄像头只作背景；此演示的面具仍由鼠标模拟定位。';}catch(err){message.textContent='摄像头未开启。请在 localhost 或 HTTPS 下打开，并允许摄像头权限。';}};
window.addEventListener('pagehide',()=>{stream?.getTracks().forEach(t=>t.stop());demo.destroy();});
let frozen=false;document.querySelector('#freeze').onclick=e=>{frozen=!frozen;demo.setPreviewFire(frozen);e.target.textContent=frozen?'关闭喷火定格':'定格查看喷火效果';};
</script></body></html>
